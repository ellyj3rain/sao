name: CI Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-verify:
    name: ci-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # save_compat_test compares the shipped record fields against a
          # baseline commit; a shallow clone would make it skip silently.
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check committed diff hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}"...HEAD
          else
            git show --check --format=fuller HEAD
          fi

      # Run the standing contract checks. Installed native inputs report
      # their absence as SKIPPED; missing required repository inputs fail.
      # Scoped proof tools retain their declared cohorts and predecessors.
      #
      # [C56] The count that used to stand here is gone on purpose. It
      # said six, which was true when it was written; the C era took it
      # to thirty-four and nobody reading the comment could see that it
      # had stopped being true. Fifteen of those exited 1 instead of
      # skipping, so this step would have refused on any machine
      # without the game - which is every machine but the operator's.
      # Border 128 holds the property now and counts them itself.
      - name: Run the borders
        shell: bash
        run: bash tools/check.sh

      # The check census distinguishes standing invocations, scoped proof
      # tools and import helpers. Creating a tool grants no execution credit.
      - name: Check standing and scoped registrations
        shell: bash
        run: python tools/gate_reach_test.py
