name: CodeQL

on:
  pull_request:
  schedule:
    - cron: "41 10 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql-python:
    name: codeql-python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected security inputs
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/gate_reach_test.py --ci-plan --base "$CI_BASE" --output _scratch/ci-security

      - name: Report unchanged security inputs
        if: github.event_name == 'pull_request' && steps.scope.outputs.security != 'true'
        run: echo 'CodeQL reported; this full PR diff changes no Python or security configuration inputs.'

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || steps.scope.outputs.security == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          build-mode: none

      - name: Analyze
        if: github.event_name != 'pull_request' || steps.scope.outputs.security == 'true'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
